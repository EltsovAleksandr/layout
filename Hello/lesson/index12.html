<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes raduga{
            0%, 15%{background-color: #FF0000;}
            15%, 29%{background-color: #FF7F00;}
            29%, 44%{background-color: #FFFF00;}
            44%, 58%{background-color: #00FF00;}
            58%, 73%{background-color: #0000FF;}
            73%, 90%{background-color: #2E2B5F;}
            90%, 100%{background-color: #8B00FF;}

        }
        .kr{
            width: 500px;
            height: 500px;
            border: 2px solid black;
            border-radius: 50%;
            background-color: black;
            animation: raduga 7s ease-in-out infinite;
        }

    </style>
</head>
<body>
    <div class="kryg">
        <div class="kr"></div>
    </div>
</body>
</html>
