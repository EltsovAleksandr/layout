    <main>
        <!-- Навигация по вкладкам -->

<!-- Содержимое вкладок -->
<div class="tabs-container">
  
  <!-- Вкладка: Каталог (для примера) -->
  <div id="catalog" class="tab-content active">
    <h2>Наши товары</h2>
    <p>Здесь располагаются карточки товаров...</p>
  </div>

  <!-- Вкладка: Доставка -->
  <div id="delivery" class="tab-content">
    <h2>Оформление доставки</h2>
    
    <form id="delivery-form" action="#" method="POST">
      <div class="form-group">
        <label for="city">Населенный пункт *</label>
        <input type="text" id="city" name="city" placeholder="Например, Москва" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="street">Улица *</label>
          <input type="text" id="street" name="street" required>
        </div>
        <div class="form-group">
          <label for="house">Дом *</label>
          <input type="text" id="house" name="house" required>
        </div>
        <div class="form-group">
          <label for="apartment">Квартира</label>
          <input type="text" id="apartment" name="apartment">
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Телефон для связи *</label>
        <input type="tel" id="phone" name="phone" placeholder="+7 (___) ___-__-__" required>
      </div>

      <!-- Кнопка из предыдущего примера -->
      <button type="submit" class="btn-primary">Подтвердить адрес</button>
    </form>
  </div>

</div>
