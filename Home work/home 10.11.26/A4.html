<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .colum{
            display: grid;
            grid-template-columns: 100% 0px 0px
        }
        .one{
            width: 100%;
            background-color: aqua;
        }
        .two{
            background-color: rgb(3, 253, 116);
        }
        .three{
            background-color: rgb(236, 253, 0);
        }
    </style>
</head>
<body>
    <div class="colum">
        <div class="one">1</div>
        <div class="two">2</div>
        <div class="three">3</div>
    </div>
</body>
</html>
